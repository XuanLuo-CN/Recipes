---
layout: default
---

<div class="content w-full md:w-4/5 h-full overflow-scroll">
  <div class="recipes mb-24 py-8">
    
    <!-- 英文放大版温馨计数器 -->
    <div class="cafe-counter">
      <span class="total-badge">MENU</span>
      Welcome to Xuan's Recipes! We have <span class="handwritten-num">{{ site.recipes | size }}</span> dishes ready.
    </div>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@700&display=swap');
      .cafe-counter { text-align: center; font-size: 36px; color: #4a4a4a; padding: 40px 0; border-bottom: 2px dashed #ddd; margin-bottom: 30px; line-height: 1.4; }
      .total-badge { background: #F53200; color: white; font-size: 20px; padding: 4px 10px; border-radius: 6px; font-weight: bold; margin-right: 10px; vertical-align: middle; }
      .handwritten-num { font-family: 'Caveat', cursive, sans-serif; font-size: 84px; color: #F53200; font-weight: bold; line-height: 0.8; display: inline-block; transform: rotate(-5deg); margin: 0 10px; vertical-align: sub; }
    </style>

    <!-- 统一的全局菜谱网格（最新发布的菜排在最前） -->
    <div class="grid px-6 h-full grid-cols-2 md:grid-cols-3 gap-4 md:gap-6">
      {% assign sorted = site.recipes | sort:"date" | reverse %}
      {% for post in sorted %}
        <a class="recipe md:hover:scale-105 md:hover:rotate-1 transition" href="{{ post.url | prepend: site.baseurl }}">
          <canvas class="aspect-video w-full rounded-xl bg-gray-100 mb-1 bg-cover bg-center"
                  {% if post.image %} style="background-image:url({{ site.baseurl }}/images/{{ post.image }});" {% endif %}>
          </canvas>
          <h1 class="font-semibold leading-tight text-stone-800 mt-1">{{ post.title }}</h1>
        </a>
      {% endfor %}
    </div>

  </div>
</div>
