---
layout: default
---

<div class="content w-full md:w-4/5 h-full overflow-scroll">
  <div class="recipes mb-24 py-8">
    
    <!-- 顶栏：一体化温馨欢迎与极简排序卡片 -->
    <div class="px-6 mb-8 mt-2">
      <div class="bg-stone-50/60 border border-stone-200/80 rounded-2xl p-5 shadow-sm max-w-2xl">
        
        <!-- 第一行：欢迎区域 -->
        <div class="flex items-center space-x-3">
          <span class="total-badge">MENU</span>
          <span class="text-stone-700 text-lg sm:text-xl font-medium">
            Welcome to Xuan's Recipes! We have <span class="handwritten-num">{{ site.recipes | size }}</span> dishes ready.
          </span>
        </div>

        <!-- 两者之间好看的分割线 -->
        <div class="border-t border-stone-200/60 my-4"></div>

        <!-- 第二行：极简文本排序切换（字号整体变小） -->
        <div class="flex items-center space-x-2 text-xs">
          <span class="text-stone-400 font-medium tracking-wider uppercase">Sort by:</span>
          <div class="flex items-center space-x-2 font-medium select-none">
            <!-- 默认激活 Date：黑色且加粗 -->
            <button id="btn-sort-recent" class="focus:outline-none transition-colors duration-150 text-stone-900 font-semibold cursor-pointer">
              Date
            </button>
            <span class="text-stone-300">/</span>
            <!-- 默认未激活 Alpha：灰色 -->
            <button id="btn-sort-pinyin" class="focus:outline-none transition-colors duration-150 text-stone-400 hover:text-stone-600 cursor-pointer">
              Alpha
            </button>
          </div>
        </div>

      </div>
    </div>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@700&display=swap');
      .total-badge { background: #F53200; color: white; font-size: 13px; padding: 3px 8px; border-radius: 6px; font-weight: bold; vertical-align: middle; }
      .handwritten-num { font-family: 'Caveat', cursive, sans-serif; font-size: 44px; color: #F53200; font-weight: bold; line-height: 0.8; display: inline-block; transform: rotate(-5deg); margin: 0 4px; vertical-align: sub; }
    </style>

    <!-- 全局菜谱网格 -->
    <div id="recipe-grid" class="grid px-6 h-full grid-cols-2 md:grid-cols-3 gap-4 md:gap-6">
      {% assign sorted = site.recipes | sort:"date" | reverse %}
      {% for post in sorted %}
        <div class="recipe-card md:hover:scale-105 md:hover:rotate-1 transition" 
             data-date="{{ post.date | date: '%Y-%m-%d' }}" 
             data-title="{{ post.title }}">
          <a class="block" href="{{ post.url | prepend: site.baseurl }}">
            <canvas class="aspect-video w-full rounded-xl bg-gray-100 mb-1 bg-cover bg-center"
                    {% if post.image %} style="background-image:url({{ site.baseurl }}/images/{{ post.image }});" {% endif %}>
            </canvas>
            <h1 class="font-semibold leading-tight text-stone-800 mt-1 text-base">{{ post.title }}</h1>
          </a>
        </div>
      {% endfor %}
    </div>

  </div>
</div>

<!-- 处理纯文本标签切换的 JavaScript -->
<script>
  document.addEventListener('DOMContentLoaded', function () {
    const grid = document.getElementById('recipe-grid');
    const cards = Array.from(grid.getElementsByClassName('recipe-card'));
    
    const btnRecent = document.getElementById('btn-sort-recent');
    const btnPinyin = document.getElementById('btn-sort-pinyin');

    function updateSort(sortBy) {
      if (sortBy === 'recent') {
        // 最近更新排序
        cards.sort((a, b) => new Date(b.dataset.date) - new Date(a.dataset.date));
        
        // 样式联动：Date 变黑粗，Alpha 变灰细
        btnRecent.className = "focus:outline-none transition-colors duration-150 text-stone-900 font-semibold cursor-pointer";
        btnPinyin.className = "focus:outline-none transition-colors duration-150 text-stone-400 hover:text-stone-600 cursor-pointer";
      } else if (sortBy === 'pinyin') {
        // 拼音 A-Z 排序
        cards.sort((a, b) => a.dataset.title.localeCompare(b.dataset.title, 'zh'));
        
        // 样式联动：Alpha 变黑粗，Date 变灰细
        btnPinyin.className = "focus:outline-none transition-colors duration-150 text-stone-900 font-semibold cursor-pointer";
        btnRecent.className = "focus:outline-none transition-colors duration-150 text-stone-400 hover:text-stone-600 cursor-pointer";
      }

      // 清空原有 DOM 网格并按新顺序重新挂载卡片
      grid.innerHTML = '';
      cards.forEach(card => grid.appendChild(card));
    }

    // 绑定文本点击事件
    btnRecent.addEventListener('click', () => updateSort('recent'));
    btnPinyin.addEventListener('click', () => updateSort('pinyin'));
  });
</script>
